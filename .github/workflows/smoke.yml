name: Production smoke test

# Exercises the real deployment the way a person would: create an account, sign in, read
# back, delete it. Unit tests and /v1/health both pass on a Worker that cannot actually
# complete a signup, because neither one spends the key-derivation cost.
#
# It also settles a question configuration cannot answer: password hashing costs ~108ms of
# CPU, and Workers Free allows 10ms per request. If this Worker is on the free plan, signup
# fails with Error 1102, and this job is where that surfaces.
#
# The account it creates is deleted before the job ends, so nothing is left behind.

on:
  workflow_dispatch:
  # After every deploy to main, so a release that breaks signup is caught here rather than
  # by the next person who tries to sign up.
  workflow_run:
    workflows: ['Deploy Worker']
    types: [completed]
    branches: [main]

jobs:
  smoke:
    # A failed deploy has nothing worth smoke-testing.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://screenregister001.daniel-queiroga.workers.dev

    steps:
      - name: Read the Workers plan, if this token is allowed to
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: dd7bf2918252965c75e4857f7f18fe56
        run: |
          # Best effort. The deploy token is scoped to Workers, D1 and R2, so it may not be
          # permitted to read billing; a 403 is not a failure, it just means the signup
          # timing below is the only evidence available.
          code=$(curl -s -o /tmp/sub.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subscription" || echo 000)
          echo "workers/subscription -> HTTP $code"
          head -c 500 /tmp/sub.json 2>/dev/null || true
          echo

      - name: Sign up, sign in, read back, delete
        run: |
          set -uo pipefail
          EMAIL="smoke_$(date +%s)_${RANDOM}@example.com"
          PASSWORD="correct horse battery staple ${RANDOM}${RANDOM}"
          JAR="$(mktemp)"; JAR2="$(mktemp)"
          fail() { echo "::error::$1"; exit 1; }

          echo "--- health"
          curl -fsS "$BASE/v1/health" -o /tmp/health.json || fail "health endpoint unreachable"
          cat /tmp/health.json; echo
          grep -q '"ok":true' /tmp/health.json || fail "health is not ok before we start"

          echo
          echo "--- signup (the step that needs real CPU)"
          start=$(date +%s%3N)
          code=$(curl -s -o /tmp/signup.json -w '%{http_code}' -c "$JAR" \
            -X POST "$BASE/v1/auth/signup" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          elapsed=$(( $(date +%s%3N) - start ))
          echo "HTTP $code in ${elapsed}ms"
          head -c 500 /tmp/signup.json; echo

          if grep -qi '1102\|exceeded resource' /tmp/signup.json; then
            fail "Worker exceeded its CPU limit (Error 1102). This account is on the Workers Free plan, whose 10ms ceiling cannot run 600k-iteration password hashing. Upgrade to Workers Paid."
          fi
          [ "$code" = "200" ] || fail "signup returned HTTP $code"
          grep -q '"user"' /tmp/signup.json || fail "signup returned no account"
          grep -q 'sr_session' "$JAR" || fail "signup set no session cookie"

          echo
          echo "--- the session works"
          curl -fsS -b "$JAR" "$BASE/v1/auth/me" -o /tmp/me.json || fail "/v1/auth/me failed"
          cat /tmp/me.json; echo
          grep -q "$EMAIL" /tmp/me.json || fail "/v1/auth/me did not return the new account"

          echo
          echo "--- a fresh sign-in exercises the key derivation again"
          start=$(date +%s%3N)
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -c "$JAR2" \
            -X POST "$BASE/v1/auth/login" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          login_ms=$(( $(date +%s%3N) - start ))
          echo "HTTP $code in ${login_ms}ms"
          [ "$code" = "200" ] || fail "login returned HTTP $code"
          grep -q '"user"' /tmp/login.json || fail "login did not return the account"

          echo
          echo "--- a wrong password is refused"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/v1/auth/login" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"definitely not the password\"}")
          [ "$code" = "401" ] || fail "a wrong password returned HTTP $code, expected 401"

          echo "--- a cross-origin write is refused even with a valid session"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" \
            -X DELETE "$BASE/v1/data" -H 'Origin: https://evil.example.net')
          [ "$code" = "403" ] || fail "a cross-origin delete returned HTTP $code, expected 403"

          echo "--- the new account can see nothing"
          curl -fsS -b "$JAR" "$BASE/v1/sessions" -o /tmp/sess.json || fail "/v1/sessions failed"
          grep -q '"sessions":\[\]' /tmp/sess.json || fail "a brand new account can see recordings"

          echo
          echo "--- client-side routes serve the app rather than 404"
          for path in '/status' '/admin' '/verify?token=x' '/reset?token=x'; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$BASE$path")
            grep -q 'id="root"' /tmp/page.html || fail "$path did not serve the app shell (HTTP $code)"
            echo "  $path -> HTTP $code, app shell served"
          done

          echo
          echo "--- a browser asking for /v1/health is sent to the dashboard"
          # Both signals are reported, because the precise one — Sec-Fetch-Mode — does not
          # survive Cloudflare's edge, and finding that out took a production run. Accept
          # is what the assertion rests on; the other line is here so a future change in
          # either direction is visible rather than silent.
          sfm=$(curl -s -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Mode: navigate' "$BASE/v1/health")
          echo "  Sec-Fetch-Mode: navigate  -> HTTP $sfm"

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            "$BASE/v1/health")
          echo "  Accept: text/html…        -> HTTP $code"
          [ "$code" = "302" ] || fail "a browser navigation to /v1/health returned HTTP $code, expected 302"
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept: text/html' "$BASE/v1/health")
          echo "  -> $loc"
          case "$loc" in */status) : ;; *) fail "/v1/health redirected to $loc, expected /status" ;; esac

          echo "  and a machine still gets JSON"
          for accept in '*/*' 'application/json'; do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' -H "Accept: $accept" "$BASE/v1/health")
            [ "$code" = "200" ] || fail "Accept: $accept returned HTTP $code, expected 200 JSON"
            grep -q '"ok":true' /tmp/h.json || fail "Accept: $accept did not return the health body"
            echo "  Accept: $accept -> HTTP 200, JSON"
          done

          echo
          echo "--- the status endpoint answers, quickly"
          # Timed, because this endpoint used to run a 600k-iteration key derivation and an
          # R2 round trip per request and took over a second. It is a reader now.
          start=$(date +%s%3N)
          curl -fsS "$BASE/v1/status" -o /tmp/status.json || fail "/v1/status failed"
          status_ms=$(( $(date +%s%3N) - start ))
          echo "  answered in ${status_ms}ms"
          [ "$status_ms" -lt 900 ] || fail "/v1/status took ${status_ms}ms; it is meant to be a cheap read"

          python3 - <<'PY' || exit 1
          import json
          d = json.load(open('/tmp/status.json'))
          print('  overall:', d['overall'], '| stale:', d['freshness']['stale'],
                '| last probe:', d['freshness']['last_check'])
          for s in d['services']:
              print(f"  {s['service']:6} {s['status']:9} latency={s['latency_ms']}  {s['detail'] or ''}")
          names = {s['service'] for s in d['services']}
          assert names == {'d1', 'r2', 'auth', 'kdf', 'email'}, f'unexpected services: {names}'
          assert d['progress']['total'] > 0, 'roadmap is empty'

          # The cron is the prober now, so a stale page means the cron has stopped.
          assert not d['freshness']['stale'], (
              'probe data is stale; the scheduled trigger is not running')

          # Every latency read exactly 0 for as long as the probes existed, because the
          # clock was read before the awaited call rather than after it. At least one
          # probe does real I/O and must show for it.
          measured = [s['latency_ms'] for s in d['services'] if s['latency_ms'] is not None]
          assert any(v > 0 for v in measured), (
              f'every probe reported 0ms, which means nothing is being timed: {measured}')

          h = d['health']
          print('  health:', {k: h[k] for k in
                ('ok', 'schema', 'auth_configured', 'email_configured', 'retention_days')})
          assert h['ok'], f'the deployment reports itself unhealthy: {h}'
          assert not h['cors_localhost'], 'production is accepting cross-origin localhost'

          print('  deploys recorded:', len(d['deploys']))
          print('  history buckets:', len(d['history']))
          PY

          echo
          echo "--- a frame round-trips, stamp and all"
          # Nothing else exercises the frame INSERT against the real schema, and this
          # project has already shipped a route that every local check passed and
          # production could not run. A column added to that statement without a matching
          # bind breaks every upload; this is the step that would catch it.
          python3 - > /tmp/ids.sh <<'PY'
          import hashlib, os, time
          ENC = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'   # Crockford base32, as the app uses

          def enc_time(ms, n=10):
              out = ''
              for _ in range(n):
                  out = ENC[ms % 32] + out
                  ms //= 32
              return out

          def ulid(ms):
              return enc_time(ms) + ''.join(ENC[b % 32] for b in os.urandom(16))

          def fingerprint(kind, value):
              d = hashlib.sha256(f'sr.stamp.{kind}:{value}'.encode()).digest()
              out, acc, bits, i = '', 0, 0, 0
              while len(out) < 4:
                  acc = (acc << 8) | d[i]; bits += 8; i += 1
                  while bits >= 5 and len(out) < 4:
                      bits -= 5
                      out += ENC[(acc >> bits) & 31]
              return out

          now = int(time.time() * 1000)
          session, frame = ulid(now), ulid(now)
          device = 'smoke-device-' + str(now)
          # Computed here from the specification rather than read back from the server, so
          # a change to the stamp format shows up as a failure instead of agreeing with
          # itself. The account fingerprint is filled in below, once the user id is known.
          print(f"SESSION_ID={session}")
          print(f"FRAME_ID={frame}")
          print(f"DEVICE_ID={device}")
          # The stamp carries the frame id whole, so the handle is the id.
          print(f"HANDLE={frame}")
          print(f"DEV_FP={fingerprint('device', device)}")
          print(f"CAPTURED_AT={time.strftime('%Y-%m-%dT%H:%M:%S', time.gmtime(now/1000))}.{now%1000:03d}Z")
          PY
          . /tmp/ids.sh
          USER_ID=$(python3 -c "import json;print(json.load(open('/tmp/me.json'))['user']['user_id'])")
          ACCT_FP=$(python3 -c "
          import hashlib
          ENC='0123456789ABCDEFGHJKMNPQRSTVWXYZ'
          d=hashlib.sha256(('sr.stamp.account:' + '$USER_ID').encode()).digest()
          out,acc,bits,i='',0,0,0
          while len(out)<4:
              acc=(acc<<8)|d[i]; bits+=8; i+=1
              while bits>=5 and len(out)<4:
                  bits-=5; out+=ENC[(acc>>bits)&31]
          print(out)")
          STAMP="SR1-${HANDLE}-${DEV_FP}${ACCT_FP}"
          echo "  stamp: $STAMP"

          curl -fsS -b "$JAR" -X PUT "$BASE/v1/sessions/$SESSION_ID" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -d "{\"device_id\":\"$DEVICE_ID\",\"started_at\":\"$CAPTURED_AT\",\"capture_fps\":1,
                 \"sensitivity\":50,\"screen_w\":1920,\"screen_h\":1080}" -o /dev/null \
            || fail "could not create a session"

          printf 'not-a-real-image' > /tmp/frame.webp
          curl -fsS -b "$JAR" -X POST "$BASE/v1/frames" -H "Origin: $BASE" \
            -F "meta={\"frame_id\":\"$FRAME_ID\",\"session_id\":\"$SESSION_ID\",\"stamp\":\"$STAMP\",\"captured_at\":\"$CAPTURED_AT\",\"offset_ms\":0,\"seq\":0,\"change_score\":0.5,\"changed_tiles\":[1,2],\"reason\":\"first\",\"width\":1920,\"height\":1080,\"bytes\":16,\"format\":\"image/webp\",\"sha256\":\"deadbeef\"}" \
            -F "full=@/tmp/frame.webp" -F "thumb=@/tmp/frame.webp" \
            -F "original=@/tmp/frame.webp" \
            -o /tmp/upload.json || fail "frame upload failed"
          cat /tmp/upload.json; echo

          curl -fsS -b "$JAR" "$BASE/v1/frames/stamp/$STAMP" -o /tmp/stamp.json \
            || fail "the stamp did not resolve to a frame"
          python3 - <<PY || exit 1
          import json
          d = json.load(open('/tmp/stamp.json'))
          f = d['frame']
          print('  resolved:', f['frame_id'], '| device:', f['device_id'], '| reason:', f['reason'])
          assert f['frame_id'] == '$FRAME_ID', f"resolved the wrong frame: {f['frame_id']}"
          # The device is written by the server from the session row, not from the upload.
          assert f['device_id'] == '$DEVICE_ID', f"device not stamped onto the frame: {f['device_id']!r}"
          assert f['user_id'] == '$USER_ID', 'frame attributed to the wrong account'
          assert f['changed_tiles'] == [1, 2], f"changed_tiles did not round-trip: {f['changed_tiles']}"
          assert d['stamp']['handle'] == '$HANDLE'
          assert d['session']['device_id'] == '$DEVICE_ID'
          PY

          echo "  the untouched capture round-trips too"
          curl -fsS -b "$JAR" "$BASE/v1/frames/$FRAME_ID/image?variant=original" \
            -o /tmp/orig.webp || fail "the original variant did not serve"
          cmp -s /tmp/frame.webp /tmp/orig.webp \
            || fail "the original variant returned different bytes from what was uploaded"
          echo "  original: $(wc -c < /tmp/orig.webp) bytes, byte-identical to the upload"

          echo "  a frame uploaded as redacted keeps no original, even if one is sent"
          # A client claiming both is confused or malicious; the safe reading is that the
          # frame is sensitive, so the original must not survive. This is the assertion
          # that would catch the server trusting the client's file over its own flag.
          R_FRAME=$(python3 -c "
          import os, time
          ENC='0123456789ABCDEFGHJKMNPQRSTVWXYZ'
          ms=int(time.time()*1000); out=''
          for _ in range(10):
              out=ENC[ms%32]+out; ms//=32
          print(out + ''.join(ENC[b%32] for b in os.urandom(16)))")
          curl -fsS -b "$JAR" -X POST "$BASE/v1/frames" -H "Origin: $BASE" \
            -F "meta={\"frame_id\":\"$R_FRAME\",\"session_id\":\"$SESSION_ID\",\"captured_at\":\"$CAPTURED_AT\",\"offset_ms\":10,\"seq\":1,\"change_score\":0.5,\"changed_tiles\":[1],\"reason\":\"scene_change\",\"width\":1920,\"height\":1080,\"bytes\":16,\"format\":\"image/webp\",\"sha256\":\"beef\",\"redacted\":true,\"redacted_regions\":[{\"x\":1,\"y\":2,\"w\":3,\"h\":4}]}" \
            -F "full=@/tmp/frame.webp" -F "thumb=@/tmp/frame.webp" -F "original=@/tmp/frame.webp" \
            -o /tmp/red.json || fail "redacted frame upload failed"
          cat /tmp/red.json; echo
          grep -q '"redacted":true' /tmp/red.json || fail "the server did not record the redaction"

          code=$(curl -s -o /tmp/noorig.json -w '%{http_code}' -b "$JAR" \
            "$BASE/v1/frames/$R_FRAME/image?variant=original")
          [ "$code" = "404" ] || fail "a redacted frame served an original (HTTP $code)"
          grep -q 'no_original' /tmp/noorig.json || fail "expected a no_original refusal"
          echo "  redacted frame -> original is 404, as it must be"

          # And the listing must agree, since that is what the player's toggle reads.
          curl -fsS -b "$JAR" "$BASE/v1/sessions/$SESSION_ID/frames" -o /tmp/lst.json \
            || fail "listing the session's frames failed"
          echo "  and usage counts the second copy, which it once did not"
          curl -fsS -b "$JAR" "$BASE/v1/usage" -o /tmp/usage.json || fail "/v1/usage failed"
          python3 - <<PY || exit 1
          import json
          u = json.load(open('/tmp/usage.json'))
          print('  usage:', {k: u.get(k) for k in
                ('frames', 'bytes', 'stored_bytes', 'original_bytes', 'unmeasured')})
          # The clean frame was uploaded with an original, so R2 holds two objects for it.
          # `bytes` reported only the first until this was fixed — a storage figure that
          # understated by about half, which is the worst way for one to be wrong.
          assert u['original_bytes'] > 0, 'the second copy is not being counted'
          assert u['bytes'] == u['stored_bytes'] + u['original_bytes'], u
          PY

          python3 - <<PY || exit 1
          import json
          frames = {f['frame_id']: f for f in json.load(open('/tmp/lst.json'))['frames']}
          clean, red = frames['$FRAME_ID'], frames['$R_FRAME']
          print('  clean   :', clean['redacted'], clean['has_original'], clean['stamp'])
          print('  redacted:', red['redacted'], red['has_original'], red['redacted_regions'])
          assert clean['redacted'] is False and clean['has_original'] is True
          # The stamp column round-trips, and it contains the frame id whole — which is the
          # property that makes it checkable against this listing by eye.
          assert clean['stamp'] == '$STAMP', f"stamp did not round-trip: {clean['stamp']!r}"
          assert clean['frame_id'] in clean['stamp'], 'the stamp does not carry its frame id'
          assert red['redacted'] is True and red['has_original'] is False
          assert red['redacted_regions'] == [{'x': 1, 'y': 2, 'w': 3, 'h': 4}]
          # Object keys are where bytes live; a caller must never be handed them.
          for f in (clean, red):
              assert 'storage_key' not in f and 'original_key' not in f, f.keys()
          PY

          echo "  a stamp for a frame that does not exist is a plain 404"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" \
            "$BASE/v1/frames/stamp/SR1-0100000000ZZZZZZZZZZZZZZZZ-00000000")
          [ "$code" = "404" ] || fail "an unknown stamp returned HTTP $code, expected 404"

          echo "  a malformed stamp is rejected, not looked up"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE/v1/frames/stamp/nonsense")
          [ "$code" = "400" ] || fail "a malformed stamp returned HTTP $code, expected 400"

          echo
          echo "--- a live recording is visible to a second sign-in"
          # The bug this covers: capture lives in browser memory, so a second browser
          # signed in as the same person saw nothing and reported that nothing was
          # recording. Only the server can carry that fact between two devices, and only a
          # heartbeat can tell a running capture from an abandoned row.
          curl -fsS -b "$JAR" "$BASE/v1/sessions/live" -o /tmp/live0.json \
            || fail "/v1/sessions/live failed"
          grep -q '"sessions":\[\]' /tmp/live0.json \
            || fail "a session with no heartbeat is being reported as live"
          echo "  before any heartbeat: nothing live, correctly"

          curl -fsS -b "$JAR" -X POST "$BASE/v1/sessions/$SESSION_ID/heartbeat" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -d '{"frames_stored":7,"bytes_stored":2048}' -o /tmp/hb.json \
            || fail "heartbeat failed"
          cat /tmp/hb.json; echo

          # JAR2 is a separate sign-in — a different login session, as a second browser is.
          curl -fsS -b "$JAR2" "$BASE/v1/sessions/live" -o /tmp/live1.json \
            || fail "the second sign-in could not read live sessions"
          python3 - <<PY || exit 1
          import json
          d = json.load(open('/tmp/live1.json'))
          ids = [s['session_id'] for s in d['sessions']]
          print('  second sign-in sees:', ids)
          assert '$SESSION_ID' in ids, 'the second sign-in cannot see the live recording'
          s = next(x for x in d['sessions'] if x['session_id'] == '$SESSION_ID')
          assert s['frames_stored'] == 7, f"counts did not carry: {s['frames_stored']}"
          assert s['stop_requested'] is False
          PY

          echo "  a stop asked for from the second sign-in reaches the first"
          curl -fsS -b "$JAR2" -X POST "$BASE/v1/sessions/$SESSION_ID/request-stop" \
            -H "Origin: $BASE" -o /dev/null || fail "request-stop failed"
          curl -fsS -b "$JAR" -X POST "$BASE/v1/sessions/$SESSION_ID/heartbeat" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -d '{"frames_stored":8,"bytes_stored":2048}' -o /tmp/hb2.json || fail "heartbeat failed"
          grep -q '"stop_requested":true' /tmp/hb2.json \
            || fail "the recording device was not told to stop"
          echo "  the recording side collects the stop on its next beat"

          echo
          echo "--- an unfinished recording can be closed"
          # Deleting used to be the only thing on offer, which is the wrong remedy for a
          # session holding real frames. Refused while it is still beating, because a live
          # capture is not unfinished.
          code=$(curl -s -o /tmp/fin0.json -w '%{http_code}' -b "$JAR" -X POST \
            -H "Origin: $BASE" "$BASE/v1/sessions/$SESSION_ID/finish")
          echo "  while still beating -> HTTP $code"
          [ "$code" = "409" ] || fail "finishing a live session returned HTTP $code, expected 409"
          grep -q 'still_recording' /tmp/fin0.json || fail "expected a still_recording refusal"

          # The heartbeat window is 45s; rather than wait it out, end the session the
          # ordinary way and confirm finish is then a no-op that says so.
          curl -fsS -b "$JAR" -X PUT "$BASE/v1/sessions/$SESSION_ID" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -d "{\"device_id\":\"$DEVICE_ID\",\"started_at\":\"$CAPTURED_AT\",\"ended_at\":\"$CAPTURED_AT\",\"capture_fps\":1,\"sensitivity\":50,\"screen_w\":1920,\"screen_h\":1080}" \
            -o /dev/null || fail "could not end the session"
          curl -fsS -b "$JAR" -X POST -H "Origin: $BASE" \
            "$BASE/v1/sessions/$SESSION_ID/finish" -o /tmp/fin1.json || fail "finish failed"
          grep -q 'already_finished' /tmp/fin1.json \
            || fail "finishing an already-closed session did not say so"
          echo "  once closed, finishing again is a no-op that says so"

          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -X POST \
            -H "Origin: $BASE" "$BASE/v1/sessions/does-not-exist/finish")
          [ "$code" = "404" ] || fail "finishing an unknown session returned HTTP $code"

          echo "  the end time comes from the last frame, not from now"
          curl -fsS -b "$JAR" "$BASE/v1/sessions" -o /tmp/sess2.json || fail "/v1/sessions failed"
          python3 - <<PY || exit 1
          import json
          from datetime import datetime, timezone
          s = next(x for x in json.load(open('/tmp/sess2.json'))['sessions']
                   if x['session_id'] == '$SESSION_ID')
          print('  started', s['started_at'], '-> ended', s['ended_at'])
          assert s['ended_at'], 'the session is still open after being closed'
          ended = datetime.fromisoformat(s['ended_at'].replace('Z', '+00:00'))
          # Closing must never stamp the current time: a recording whose browser died on
          # Friday and was noticed on Monday did not run for three days.
          drift = abs((datetime.now(timezone.utc) - ended).total_seconds())
          assert drift < 300, f'ended_at looks like now rather than the recording: {drift}s'
          PY

          echo
          echo "--- the operator surface is closed to an ordinary account"
          # A 404 rather than a 403: whether this deployment has an operator surface at all
          # is not something a signed-in stranger needs confirmed.
          for path in /v1/admin/overview /v1/admin/users /v1/admin/events; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE$path")
            [ "$code" = "404" ] || fail "$path returned HTTP $code to a non-admin, expected 404"
            echo "  $path -> 404"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -X DELETE \
            -H "Origin: $BASE" "$BASE/v1/admin/sessions/$SESSION_ID")
          [ "$code" = "404" ] || fail "a non-admin could reach the admin delete (HTTP $code)"
          echo "  admin delete -> 404"
          # And the session it tried to delete is still there.
          curl -fsS -b "$JAR" "$BASE/v1/sessions/$SESSION_ID/frames" -o /tmp/still.json \
            || fail "the session vanished after a refused admin delete"
          grep -q "$FRAME_ID" /tmp/still.json \
            || fail "a refused admin delete removed frames anyway"
          echo "  and the frames it targeted are untouched"

          echo "  /v1/auth/me does not claim admin for an ordinary account"
          curl -fsS -b "$JAR" "$BASE/v1/auth/me" -o /tmp/me2.json || fail "/v1/auth/me failed"
          grep -q '"is_admin":false' /tmp/me2.json \
            || fail "an ordinary account is being told it is an admin"

          echo "  and neither the frames nor the session listing of another account"
          for path in "/v1/admin/sessions/$SESSION_ID/frames"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE$path")
            [ "$code" = "404" ] || fail "$path returned HTTP $code to a non-admin, expected 404"
            echo "  $path -> 404"
          done

          # Operators may now view frames, but only their own account may use the ordinary
          # image route. A frame id that is not yours is a 404 there, admin or not — the
          # operator path is a separate, logged branch and this checks the plain one still
          # refuses. Nothing here belongs to anyone else, so a made-up id stands in.
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" \
            "$BASE/v1/frames/01M000000000000000000000AA/image")
          [ "$code" = "404" ] || fail "an unknown frame returned HTTP $code, expected 404"

          echo
          echo "--- clean up: delete the throwaway account"
          curl -fsS -b "$JAR" -X DELETE "$BASE/v1/account" -H "Origin: $BASE" -o /tmp/del.json \
            || fail "account deletion failed"
          cat /tmp/del.json; echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" "$BASE/v1/auth/me")
          [ "$code" = "401" ] || fail "the deleted account still authenticates (HTTP $code)"

          echo
          echo "=============================================================="
          echo " signup ${elapsed}ms · login ${login_ms}ms (both include a"
          echo " 600,000-iteration PBKDF2 plus network round trip)"
          echo " Signup completing at all means this Worker's CPU ceiling is"
          echo " far above the 10ms Workers Free allows."
          echo "=============================================================="
