name: Diagnose production error

# Captures the Worker's own stack trace for a failing request.
#
# `app.onError` returns a deliberately opaque {"error":"internal_error"} to callers, which
# is correct — an unhandled exception must not leak internals to the internet — but it
# means the only place the real cause exists is the Worker's log. This tails that log while
# provoking the failure, so the diagnosis comes from the runtime rather than from a guess.

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path to hammer, e.g. /v1/status'
        required: false
        default: '/v1/status'
      count:
        description: 'How many requests to send'
        required: false
        default: '25'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Tail the Worker while hammering the endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ inputs.path }}
          COUNT: ${{ inputs.count }}
        working-directory: apps/api
        run: |
          set -uo pipefail
          BASE="https://screenregister001.daniel-queiroga.workers.dev"

          npx wrangler tail --format json > /tmp/tail.jsonl 2>/tmp/tail.err &
          TAIL_PID=$!
          sleep 12   # let the tail session attach before generating traffic

          echo "--- $COUNT requests to $TARGET"
          : > /tmp/codes.txt
          for i in $(seq 1 "$COUNT"); do
            # Cache-bust, so a 15s edge cache cannot hide an intermittent failure.
            code=$(curl -s -o "/tmp/body_$i.txt" -w '%{http_code} %{time_total} %{size_download}' \
              --max-time 30 "$BASE$TARGET?_cb=$i-$RANDOM" || echo "000 0 0")
            echo "$i $code" | tee -a /tmp/codes.txt
            # Anything that is not a 200 is the thing we came for; print it in full.
            case "$code" in
              200\ *) : ;;
              *) echo "    body: $(head -c 400 "/tmp/body_$i.txt")" ;;
            esac
            sleep 1
          done

          echo
          echo "--- status code distribution"
          awk '{print $2}' /tmp/codes.txt | sort | uniq -c | sort -rn

          echo
          echo "--- slowest responses"
          sort -k3 -rn /tmp/codes.txt | head -5

          sleep 10
          kill $TAIL_PID 2>/dev/null || true
          sleep 2

          echo
          echo "=== wrangler tail stderr ==="
          head -20 /tmp/tail.err || true

          echo
          echo "=== exceptions and logs from the Worker ==="
          python3 - <<'PY'
          import json
          try:
              lines = open('/tmp/tail.jsonl').read().splitlines()
          except FileNotFoundError:
              lines = []
          if not lines:
              print('no tail output captured')
          seen = 0
          for line in lines:
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  e = json.loads(line)
              except Exception:
                  continue
              req = (e.get('event') or {}).get('request') or {}
              outcome = e.get('outcome')
              exc = e.get('exceptions') or []
              logs = e.get('logs') or []
              # An 'ok' request with nothing logged is noise; print the interesting ones.
              if outcome == 'ok' and not exc and not logs:
                  seen += 1
                  continue
              print('---', outcome, req.get('method', ''), req.get('url', ''))
              print('    cpu_ms:', (e.get('cpuTime') or e.get('cpu_time')),
                    ' wall_ms:', (e.get('wallTime') or e.get('wall_time')))
              for ex in exc:
                  print('  EXCEPTION:', ex.get('name'), '-', ex.get('message'))
                  for s in str(ex.get('stack') or '').splitlines()[:12]:
                      print('     ', s)
              for lg in logs:
                  msg = ' '.join(str(m) for m in (lg.get('message') or []))
                  print(f"  {lg.get('level')}: {msg[:600]}")
          print(f'({seen} clean requests with no logs, not shown)')
          PY
