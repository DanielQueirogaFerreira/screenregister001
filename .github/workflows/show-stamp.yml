name: Show the stamp on a stored frame

# Reads the stamp off a real frame, out of R2, as pixels.
#
# The stamp is drawn by the browser at capture time, so what is deployed and what is
# actually burned into a frame can disagree — a tab opened before a deploy keeps drawing
# the old one until it reloads. Nothing in the database can settle that: the row stores the
# SR1 handle, but the time lines exist only in the image. So this fetches the image.
#
# Read-only. It downloads one object, crops the bottom-left corner, and prints it as
# base64 so it can be looked at without leaving a file anywhere.

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'R2 key of a frame. Leave empty for the most recently captured one.'
        required: false
        type: string

jobs:
  show:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the frame
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KEY: ${{ inputs.key }}
        run: |
          # The heredoc lives here, at the base indentation of this block, and not inside
          # the `if` below. YAML strips the common indentation from a block scalar, so a
          # terminator indented deeper than its neighbours still carries leading spaces
          # when bash sees it — and bash then reads to end of file looking for it.
          cat > /tmp/pick.py <<'PY'
          import json
          d = json.load(open('/tmp/newest.json'))
          rows = d[0]['results'] if isinstance(d, list) else d['result'][0]['results']
          if not rows:
              raise SystemExit('no frames are stored')
          r = rows[0]
          print(f"newest frame: captured {r['captured_at']}  "
                f"{r['width']}x{r['height']}  {r['bytes']} bytes")
          open('/tmp/key.txt', 'w').write(r['storage_key'])
          PY

          if [ -n "$KEY" ]; then
            echo "$KEY" > /tmp/key.txt
          else
            # Not the very newest. The row is written when the upload lands, but asking
            # for the frame captured a moment ago while a recording is running invites a
            # race with whatever is still settling, and the failure mode is a file that is
            # not a WebP at all. A frame a minute old is just as good a witness.
            npx --yes wrangler@4 d1 execute screenregister001 --remote --json --command \
              "SELECT storage_key, captured_at, width, height, bytes FROM frames
                WHERE captured_at < strftime('%Y-%m-%dT%H:%M:%SZ','now','-60 seconds')
                ORDER BY captured_at DESC LIMIT 1" > /tmp/newest.json
            python3 /tmp/pick.py
          fi

          echo "key: $(cat /tmp/key.txt)"
          rm -f /tmp/frame.webp
          npx --yes wrangler@4 r2 object get "screenregister-frames/$(cat /tmp/key.txt)" \
            --remote --file /tmp/frame.webp
          ls -l /tmp/frame.webp

          # Check it is actually a WebP before handing it to an image library. A previous
          # run died with "unsupported image format" and the log said nothing about what
          # had landed on disk instead, which turned a one-line problem into a guess.
          head -c 16 /tmp/frame.webp | od -c | head -2
          if ! head -c 12 /tmp/frame.webp | grep -q 'WEBP'; then
            echo "::error::downloaded file is not a WebP — first bytes above"
            exit 1
          fi
          echo "confirmed: RIFF/WEBP container, $(stat -c%s /tmp/frame.webp) bytes"

      - name: Crop the stamp corner and print it
        # Not in apps/api: that is a pnpm workspace package, and npm installing into it
        # fights the workspace. A scratch directory owns this tool and nothing else.
        working-directory: /tmp
        run: |
          # Output NOT swallowed. An earlier version sent this to /dev/null, so when it
          # failed the log showed an exit code and nothing else — the one moment the
          # output was worth having was the one moment it had been thrown away.
          #
          # And node runs FROM the install directory rather than pointing NODE_PATH at it.
          # NODE_PATH is a CommonJS mechanism and ESM ignores it completely, so `import
          # sharp` failed with ERR_MODULE_NOT_FOUND while node_modules sat right there. A
          # bare specifier is resolved by walking node_modules up from the current
          # directory, so being in that directory is the thing that makes it work.
          mkdir -p /tmp/imgtools
          npm install --no-save --prefix /tmp/imgtools sharp@0.34
          ls -d /tmp/imgtools/node_modules/sharp
          cd /tmp/imgtools
          node --input-type=module <<'JS'
          import sharp from 'sharp';
          const img = sharp('/tmp/frame.webp');
          const { width, height } = await img.metadata();

          // The stamp sits bottom-left. Take a generous strip so the crop does not depend
          // on how many lines the build draws — the line count is itself the evidence for
          // which build produced this frame.
          const cropH = Math.min(height, 78);
          const cropW = Math.min(width, 420);

          // Grayscale, no magnification, aggressive palette. The stamp is white monospace
          // on a black scrim, so colour carries nothing, and the font is already 15px on a
          // frame this wide — enlarging it only makes the payload bigger. This has to come
          // back through a log, so every byte saved is one that survives the trip.
          const buf = await sharp('/tmp/frame.webp')
            .extract({ left: 0, top: height - cropH, width: cropW, height: cropH })
            .greyscale()
            .png({ compressionLevel: 9, palette: true, colours: 16 })
            .toBuffer();

          const b64 = buf.toString('base64');
          console.log(`frame ${width}x${height}, stamp crop ${cropW}x${cropH}, `
            + `png ${buf.length} bytes, base64 ${b64.length} chars`);
          console.log('---BEGIN STAMP PNG BASE64---');
          for (let i = 0; i < b64.length; i += 400) console.log(b64.slice(i, i + 400));
          console.log('---END STAMP PNG BASE64---');
          JS
