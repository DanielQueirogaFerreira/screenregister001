name: Deploy Worker

# Cloudflare's dashboard-driven "Workers Builds" is deliberately not used. The deploy
# lives here instead so it is version-controlled, reviewable, and debuggable from the run
# log rather than from build settings nobody can see in a diff.
#
# Required repository secret:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit
# Optional repository secret:
#   CLOUDFLARE_ACCOUNT_ID  only needed if the token can see more than one account
#
# AUTH_SECRET is NOT set from here. It is a Worker secret, managed in Cloudflare, and
# deliberately never passes through CI.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: >-
          Deploy without applying D1 migrations. Only safe when the build carries no new
          ones — the schema it expects must already be live. This exists because a D1
          outage or an exhausted quota blocks the migration step even when it has nothing
          to do, and that must not stand between a fix and production.
        type: boolean
        required: false
        default: false

# One deploy at a time. A queued run is pointless once a newer commit is deploying,
# but never cancel a run mid-`wrangler deploy`.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full history, not the default single commit. The codebase-evolution log is built
      # from `git log` over the last 30 days, and a shallow checkout has nothing to read —
      # it would produce an empty animation and no error.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Runs the test suite and builds the SPA into apps/web/dist, which the Worker
      # serves via [assets]. The deploy preflight refuses to run without it.
      - name: Test and build
        run: pnpm run build

      # Written into the built assets rather than committed. A generated file in the
      # repository would change on every deploy and be the loudest node on its own graph;
      # regenerating it here means it can never be older than the code it describes, and
      # nothing accumulates in git history. It must run after the build, which empties
      # apps/web/dist.
      - name: Build the codebase-evolution log
        run: pnpm run evolution

      # The repository's own files, so the codebase viewer can show what is inside a node
      # rather than only what has happened to it. One asset per file, uploaded by content
      # hash, so a deploy re-uploads only what changed.
      #
      # This publishes the source at the Worker's origin, which is safe for one specific
      # reason: this repository is public and already served unauthenticated by
      # raw.githubusercontent.com, so nothing new is exposed. If it is ever made private,
      # remove this step — /evolution sits outside the auth gate.
      - name: Bundle the source for the codebase viewer
        run: pnpm run source-bundle

      - name: Resolve account id
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      # Idempotent: D1 records applied migrations, so this is a no-op when there is
      # nothing new. It runs before the deploy so the schema is never behind the code.
      - name: Apply D1 migrations
        if: ${{ inputs.skip_migrations != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if pnpm run migrate:api 2>&1 | tee /tmp/migrate.log; then
            exit 0
          fi

          # D1 bills on rows read, and exhausting the daily allowance fails every query —
          # including the one that merely asks which migrations have already run. The error
          # names a "free tier daily row read limit" and says nothing about what spent it,
          # so without this the log reads as a broken migration rather than a quota.
          if grep -q 'row read limit\|code: 7500' /tmp/migrate.log; then
            cat <<'NOTE'
          ::error::D1's daily allowance is exhausted, so no query can run — this is a
          quota, not a bad migration. Nothing was deployed and production still serves the
          previous version, because migrations run before the deploy. It clears at midnight
          UTC or with a paid plan. To ship a build that needs no new migration meanwhile,
          re-run this workflow with skip_migrations checked.
          NOTE
            exit 1
          fi

          echo "::error::D1 migrations failed. See the log above."
          exit 1

      - name: Note that migrations were skipped
        if: ${{ inputs.skip_migrations == true }}
        run: |
          echo "::warning::Deploying without applying migrations, by request. This is only \
          correct if the schema this build expects is already live."

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          pnpm run deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "worker_url=$url" >> "$GITHUB_ENV"

      # A deploy can upload cleanly and still serve a broken service. Wrangler has no idea
      # whether AUTH_SECRET exists, so a Worker missing it deploys green and then returns
      # 503 on every authenticated route. That happened. Ask the running Worker instead of
      # inferring health from the fact that the upload succeeded.
      - name: Verify the deployment serves
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$worker_url" ]; then
            echo "::warning::No workers.dev URL in the deploy output; skipping health check."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 15 "$worker_url/v1/health" || true)
            echo "attempt $attempt: $body"
            case "$body" in *'"ok":true'*) echo "Healthy: $worker_url"; exit 0 ;; esac
            sleep 5
          done
          echo "Secrets configured on the Worker (names only, no values):"
          pnpm --filter @sr/api exec wrangler secret list || true
          echo "::error::$worker_url/v1/health never reported ok:true. Last response: $body"
          exit 1

      # Written whether the deploy passed or failed, because a failed deploy is exactly the
      # entry you go looking for. Parameterised rather than interpolated: a commit message
      # is attacker-influenced text and must never be concatenated into SQL.
      - name: Record the deployment
        if: always() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RESULT: ${{ job.status }}
        working-directory: apps/api
        run: |
          # A single-quoted SQL literal with any embedded quote doubled — the SQLite
          # escaping rule — since `wrangler d1 execute` takes a command string, not binds.
          sql_quote() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"; }

          subject="$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-200)"
          status_value="success"
          [ "$RESULT" = "success" ] || status_value="failure"

          npx wrangler d1 execute screenregister001 --remote --command \
            "INSERT INTO deploy_events (at, commit_sha, commit_message, actor, run_id, run_url, status)
             VALUES ($(sql_quote "$(date -u +%Y-%m-%dT%H:%M:%SZ)"),
                     $(sql_quote '${{ github.sha }}'),
                     $(sql_quote "$subject"),
                     $(sql_quote '${{ github.actor }}'),
                     $(sql_quote '${{ github.run_id }}'),
                     $(sql_quote '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'),
                     $(sql_quote "$status_value"))" || \
            echo "::warning::Could not record the deployment; the deploy itself is unaffected."
