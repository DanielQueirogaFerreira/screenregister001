name: Rotate AUTH_SECRET

# Sets (or replaces) the Worker's token-signing key.
#
# This exists because the key must never pass through a chat transcript, a commit, or an
# operator's clipboard — and equally must not require a working local wrangler install to
# set. The runner generates it, pipes it straight into Cloudflare, and forgets it: the
# value is never echoed, never written to a file, and never leaves this job.
#
# Run it from the Actions tab, or let an agent dispatch it. Re-running rotates the key,
# which invalidates existing device tokens and (once accounts ship) nothing else.

on:
  workflow_dispatch:

concurrency:
  group: auth-secret
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate and set the signing key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/api
        run: |
          set -o pipefail
          # 32 bytes of CSPRNG output as 64 hex characters. Masked so that even an
          # accidental echo further down cannot surface it in the log.
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          printf '%s' "$SECRET" | npx wrangler secret put AUTH_SECRET
          unset SECRET
          echo "AUTH_SECRET set. Its value exists only inside Cloudflare."

      - name: Confirm the Worker now accepts it
        run: |
          url="https://screenregister001.daniel-queiroga.workers.dev/v1/health"
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 15 "$url" || true)"
            echo "attempt $attempt: $body"
            case "$body" in *'"auth_configured":true'*)
              echo "Healthy — the signing key is live."
              exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::$url still reports auth_configured:false after the secret was set."
          exit 1
