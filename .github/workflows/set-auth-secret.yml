name: Rotate AUTH_SECRET

# Sets (or replaces) the Worker's token-signing key, and deploys.
#
# Two problems this solves at once.
#
# 1. The key must never travel through a chat transcript, a commit or a clipboard — but
#    also must not require a working local wrangler login. A runner has neither problem:
#    it generates the key itself and hands it straight to Cloudflare.
#
# 2. `wrangler secret put` was failing on this Worker with "you attempted to modify a
#    secret, but the latest version of your Worker isn't currently deployed" — a leftover
#    from the `wrangler versions upload` era, which left an uploaded-but-undeployed
#    version pinned. Every attempt to set the key, by anyone, failed on that. Deploying
#    with `--secrets-file` sets the secret and deploys in a single operation, which clears
#    that state instead of stepping around it.
#
# Re-running rotates the key.

on:
  workflow_dispatch:

concurrency:
  group: deploy-worker      # shares the deploy lock: never race the deploy workflow
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # wrangler.toml serves the SPA from ../web/dist, and the deploy preflight refuses to
      # ship without it, so the client has to be built even though only a secret is changing.
      - name: Build the client
        run: pnpm run build

      - name: Generate the key and deploy with it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/api
        run: |
          set -o pipefail
          umask 077                       # the file is readable only by this job's user
          trap 'rm -f secrets.env' EXIT   # and is removed however this step ends

          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"      # masked, so even an accidental echo cannot leak it
          printf 'AUTH_SECRET=%s\n' "$SECRET" > secrets.env
          unset SECRET

          node scripts/preflight.mjs
          npx wrangler deploy --secrets-file secrets.env

          echo "Deployed. The key exists only inside Cloudflare."

      - name: Confirm the Worker actually accepts it
        run: |
          url="https://screenregister001.daniel-queiroga.workers.dev/v1/health"
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 15 "$url" || true)"
            echo "attempt $attempt: $body"
            case "$body" in *'"auth_configured":true'*)
              echo "Healthy — the signing key is live."
              exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::$url still reports auth_configured:false after the deploy."
          exit 1
