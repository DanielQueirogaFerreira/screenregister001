name: Set operator access

# Grants the operator view to one or more accounts.
#
# ADMIN_EMAILS is set as a Worker *secret*, not a [vars] entry, for two reasons. Plain vars
# are declared in wrangler.toml and would put a personal address into a git repository;
# secrets are not, and never appear in a diff. And a var set through the dashboard is wiped
# by the next `wrangler deploy`, because deploy replaces the whole vars bundle from
# wrangler.toml — a secret survives it. A permission that silently disappears on the next
# release is worse than one that was never granted.
#
# The value is read at request time by admin.ts. Nothing in the application can change it;
# changing it takes access to the Cloudflare account, which is the property that makes it
# safe to hang the largest capability in the system on.
#
# Run this from the Actions tab. The address you type is visible in this run's log and in
# the workflow inputs, so use the address already on the account rather than anything else.

on:
  workflow_dispatch:
    inputs:
      emails:
        description: 'Comma-separated addresses. Must match the account email exactly. Empty revokes all operator access.'
        required: false
        default: ''

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAILS: ${{ inputs.emails }}
        working-directory: apps/api
        run: |
          set -uo pipefail
          if [ -z "${EMAILS// /}" ]; then
            echo "No addresses given — revoking operator access entirely."
            npx wrangler secret delete ADMIN_EMAILS --force || \
              echo "::warning::Nothing to delete; operator access was already unset."
          else
            # Piped rather than passed as an argument, so it never reaches a process list.
            printf '%s' "$EMAILS" | npx wrangler secret put ADMIN_EMAILS \
              || { echo "::error::Could not set ADMIN_EMAILS."; exit 1; }
            echo "Operator access set for: $EMAILS"
          fi

          echo
          echo "Secrets on the Worker (names only, never values):"
          npx wrangler secret list || true

      - name: Confirm the Worker still serves
        run: |
          BASE=https://screenregister001.daniel-queiroga.workers.dev
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 15 "$BASE/v1/health" || true)
            case "$body" in *'"ok":true'*) echo "Healthy."; exit 0 ;; esac
            sleep 5
          done
          echo "::error::$BASE/v1/health did not report ok:true. Last response: $body"
          exit 1
