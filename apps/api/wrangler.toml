name = "screenregister001"
main = "src/index.ts"
# Kept current deliberately: an old date silently pins old runtime behaviour.
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]

# Frame blobs. Retention is enforced by the scheduled handler below rather than by an
# R2 lifecycle rule, so that the catalogue row and the object are always deleted together.
[[r2_buckets]]
binding = "FRAMES"
bucket_name = "screenregister-frames"

# The catalogue. Names match the resources already in the account; a mismatch here
# silently creates parallel resources instead of using the ones that exist.
[[d1_databases]]
binding = "DB"
database_name = "screenregister001"
database_id = "c92f63da-e3a4-4852-ace5-ed30ea851db3"

# The recorder UI, served from the same Worker. One deployment, one origin, and the
# browser client talks to /v1 on the origin it was loaded from — no CORS, no second URL
# to configure. Requests that do not match a built asset fall through to the Worker.
[assets]
directory = "../web/dist"
# The client owns its own routing. Without this, any path that is not a built file —
# /status, and the /verify and /reset links sent by email — misses the assets, falls
# through to the Worker, and 404s. Serving index.html lets the app route them.
not_found_handling = "single-page-application"
# The binding is what makes not_found_handling reachable at all. Cloudflare only applies it
# when there is no Worker, or when the Worker defers back via this binding — and there is a
# Worker here, so without it every client-side route lands on Hono and 404s.
binding = "ASSETS"

[vars]
# Temporarily 0, at the account owner's request: an explicit purge of every stored frame.
# Zero puts the Worker in purge mode, which runs the retention sweep on the five-minute
# cron instead of only at 03:00 — so it also deletes frames captured while it is set.
# Put this back to "7" once the sweep has finished.
RETENTION_DAYS = "0"

# Cross-origin calls from localhost, off in production. The deployed Worker serves its own
# client, so all real traffic is same-origin; a developer machine runs many unrelated local
# services and none of them should be able to reach this API from the browser. Local
# development turns this on through apps/api/.dev.vars, which never ships.
ALLOW_LOCALHOST_ORIGINS = "false"

# ADMIN_EMAILS is deliberately NOT here.
#
# It grants the operator view — seeing and deleting every account's recordings — and it is
# set as a Worker secret instead, by .github/workflows/set-admin-emails.yml. Two reasons.
# A [vars] entry lives in this file, so a personal address would be committed to the
# repository. And it means the value cannot be changed by anything the application does to
# itself: altering it takes access to the Cloudflare account, which is the property that
# makes it safe to hang the largest capability in the system on. Unset means nobody is an
# operator, which is the right default for a deployment nobody has configured.

# Two schedules, told apart inside the handler by `event.cron`.
#
# Every five minutes: probe D1 and R2 and record the result, so the status page can answer
# "was it working at 14:35" rather than only "is it working now". Hourly sampling would
# leave gaps wider than most incidents.
#
# Nightly at 03:00: the retention sweep, which enforces the 7-day ceiling server-side and
# is expensive enough to want exactly once a day.
[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

# Logs, so the first production incident is diagnosable rather than guessed at. The
# retention sweep in particular runs unattended at 03:00 and is otherwise invisible.
[observability]
enabled = true

# Fail the deploy if the token-signing key is not configured on the Worker, instead of
# shipping a Worker that 503s every authenticated route. Validated against the live Worker
# before upload, so a missing key never reaches production.
[secrets]
required = ["AUTH_SECRET"]
# Optional: ADMIN_EMAILS, comma-separated. Unset means nobody has operator access.
