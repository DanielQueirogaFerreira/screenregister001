<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenRegister</title>
    <meta name="color-scheme" content="dark light" />
    <!--
      Inline data URI rather than a file: without any favicon the browser requests
      /favicon.ico, misses the built assets, falls through to the Worker and logs a 404 on
      every single page load. A recording dot, and no request at all.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1014'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e5484d'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      The colour mode has to be on <html> before the first paint, not after React mounts.
      Set it there and the page paints once; set it in a component and every light-mode
      user gets a dark flash on every load, which is more jarring than either mode is on
      its own. Kept to one statement and wrapped, because a throw here would stop the
      module script below from ever running.
    -->
    <script>
      try {
        var m = localStorage.getItem('sr.theme');
        if (m !== 'light' && m !== 'dark') {
          m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = m;
        document.documentElement.style.colorScheme = m;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
